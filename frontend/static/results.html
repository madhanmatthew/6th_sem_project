<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch Report — AI Emergency Response</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{--bg:#f7f8fa;--panel:#fff;--ink:#18212f;--muted:#687386;
  --line:#dbe2ea;--blue:#2563eb;--green:#2f9e44;--red:#d83232;--amber:#c77700;
  --shadow:0 14px 40px rgba(24,33,47,.08);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:36px;height:36px;border-radius:7px;background:#ffe5e5;color:var(--red);display:grid;place-items:center;font-size:18px;border:1px solid #ffbbbb;flex-shrink:0;}
.brand h1{font-size:15px;font-weight:750;}
.brand p{font-size:11px;color:var(--muted);}
.nav{display:flex;gap:7px;flex-wrap:wrap;}
.nav a{text-decoration:none;color:#344154;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;}
.nav a.active{color:#fff;background:var(--blue);border-color:var(--blue);}
.back-btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--blue);font-size:13px;font-weight:700;padding:7px 13px;border:1px solid var(--blue);border-radius:999px;background:var(--panel);}
.back-btn:hover{background:#eef3ff;}
/* BODY */
.shell{max-width:1060px;margin:0 auto;padding:28px 20px 60px;}
/* STATUS BANNER */
.status-banner{display:flex;align-items:center;gap:14px;background:#eefbf2;border:1px solid #b2e4c0;border-radius:11px;padding:16px 20px;margin-bottom:22px;}
.status-icon{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:22px;flex-shrink:0;}
.status-text h2{font-size:17px;font-weight:800;color:#1a7535;margin-bottom:2px;}
.status-text p{font-size:13px;color:#2d6b40;}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.kpi-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.kpi-val{font-size:32px;font-weight:800;line-height:1;color:var(--ink);}
.kpi-val.red{color:var(--red);}
.kpi-val.green{color:var(--green);}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:5px;}
/* SECTION TITLE */
.sec{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px;}
/* COMPARE */
.compare{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.compare-head{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;}
.compare-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;}
.compare-row:last-child{border-bottom:none;}
.compare-row .method{color:#344154;}
.time-bad{font-weight:800;color:var(--red);font-size:16px;}
.time-good{font-weight:800;color:var(--green);font-size:16px;}
/* CORRIDOR */
.corridor{display:flex;align-items:center;gap:10px;background:#eefbf2;border:1px solid #b2e4c0;border-radius:10px;padding:13px 16px;margin-bottom:20px;font-size:14px;font-weight:700;color:#1a7535;}
.corridor-dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(47,158,68,.2);flex-shrink:0;}
/* AGENTS */
.agents-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
@media(min-width:860px){.agents-grid{grid-template-columns:repeat(4,1fr);}}
.agent-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.agent-head{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);background:var(--bg);}
.agent-head i{font-size:18px;}
.agent-body{padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.75;}
.agent-body strong{color:var(--ink);font-weight:600;}
/* HOSPITAL TABLE */
.htable{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.htable th{padding:9px 13px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);background:var(--bg);}
.htable td{padding:10px 13px;font-size:13px;border-bottom:1px solid var(--line);}
.htable tr:last-child td{border-bottom:none;}
.htable tr.selected td{background:#f0fdf4;font-weight:600;color:#1a7535;}
.badge-trauma{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700;background:#ffe5e5;color:var(--red);}
.badge-trauma.yes{background:#e8f5e9;color:#1a7535;}
/* NO DATA */
.no-data{text-align:center;padding:48px;color:var(--muted);font-size:15px;}
.no-data a{color:var(--blue);font-weight:700;}
@media(max-width:660px){.kpi-row{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark"><i class="ti ti-ambulance"></i></div>
    <div>
      <h1>AI Emergency Response System</h1>
      <p>Full Dispatch Report</p>
    </div>
  </div>
  <nav class="nav">
    <a href="/">Overview</a>
    <a href="/map">Live Map</a>
    <a href="/results" class="active">Dispatch Report</a>
    <a href="/dispatch">Dispatch Console</a>
  </nav>
</header>

<main class="shell" id="main-content">
  <div class="no-data" id="no-data" style="display:none">
    <p>No dispatch data found.<br>
    <a href="/map">← Go back to the Live Map and trigger an emergency first.</a></p>
  </div>
</main>

<script>
const raw = sessionStorage.getItem("dispatchResult");
const incLocation = sessionStorage.getItem("dispatchLocation") || "Unknown";
const incSeverity = sessionStorage.getItem("dispatchSeverity") || "";

if (!raw) {
  document.getElementById("no-data").style.display = "block";
} else {
  const data    = JSON.parse(raw);
  const amb     = data.agents.ambulance;
  const hosp    = data.agents.hospital;
  const traff   = data.agents.traffic;
  const pol     = data.agents.police;
  const parsed  = data.parsed;
  const coord   = data.coordination;

  const aiEta   = amb.eta_minutes;
  // Traditional ETA: distance at 25km/h (no signal override) + 8 min dispatch delay
  const distKm  = (amb && amb.distance_km) ? amb.distance_km : 5.0;
  const tradEta = Math.max(aiEta + 5, Math.round((distKm / 25) * 60 + 8));
  const saved   = tradEta - aiEta;

  const hostDist = (hosp.all_hospitals||[]).find(h=>h.name===hosp.recommended)?.distance_km || "—";

  document.getElementById("main-content").innerHTML = `
    <a href="/map" class="back-btn" style="margin-bottom:18px;display:inline-flex">
      <i class="ti ti-arrow-left"></i> Back to Live Map
    </a>

    <div class="status-banner">
      <div class="status-icon"><i class="ti ti-check"></i></div>
      <div class="status-text">
        <h2>Dispatch Complete — ${incLocation}</h2>
        <p>Severity ${parsed.severity}/5 · ${parsed.severity_label} · ${amb.ambulances_dispatched} ambulance(s) dispatched · ${parsed.incident_type}</p>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-label">AI ETA</div>
        <div class="kpi-val green">${aiEta}</div>
        <div class="kpi-sub">minutes to scene</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Traditional ETA</div>
        <div class="kpi-val red">${tradEta}</div>
        <div class="kpi-sub">without AI system</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Time Saved</div>
        <div class="kpi-val green">${saved}</div>
        <div class="kpi-sub">minutes faster</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Beds Reserved</div>
        <div class="kpi-val">${hosp.beds_reserved}</div>
        <div class="kpi-sub">at ${hosp.recommended.split(" ").slice(0,2).join(" ")}</div>
      </div>
    </div>

    <div class="corridor">
      <div class="corridor-dot"></div>
      Green corridor activated — traffic signals synchronized along ${amb.route}
    </div>

    <div class="sec">Response Time Comparison</div>
    <div class="compare">
      <div class="compare-head">Traditional vs AI-Powered System</div>
      <div class="compare-row"><span class="method">🚑 Traditional manual response</span><span class="time-bad">${tradEta} min</span></div>
      <div class="compare-row"><span class="method">🤖 AI Smart System (this dispatch)</span><span class="time-good">${aiEta} min</span></div>
      <div class="compare-row"><span class="method">⏱ Total time saved</span><span class="time-good">${saved} min faster</span></div>
    </div>

    <div class="sec">Agent Decision Summary</div>
    <div class="agents-grid">
      ${ac("ti-ambulance","#2563eb","Ambulance Agent",[
        ["Unit",amb.selected_unit],["Base",amb.unit_base],
        ["ETA",`${amb.eta_minutes} min`],["Route",amb.route],
        ["Triage",amb.triage_priority],["Ambulances",amb.ambulances_dispatched],
        ["Paramedic teams",amb.paramedic_teams],["Confidence",`${(amb.confidence*100).toFixed(0)}%`]
      ])}
      ${ac("ti-building-hospital","#0f9f8f","Hospital Agent",[
        ["Selected",hosp.recommended],["Free beds",hosp.recommended_beds],
        ["Distance",`${hostDist} km`],["Trauma unit",hosp.trauma_unit?"Yes":"No"],
        ["Beds reserved",hosp.beds_reserved],["Fallback",hosp.fallback],
        ["Fallback beds",hosp.fallback_beds],["Confidence",`${(hosp.confidence*100).toFixed(0)}%`]
      ])}
      ${ac("ti-traffic-lights","#c77700","Traffic Agent",[
        ["Congestion",traff.congestion_level],["Delay forecast",`${traff.predicted_delay_min} min`],
        ["Corridor",traff.corridor_status],["Signals overridden",traff.junctions_overridden],
        ["Diversion 1",traff.diversion_roads?.[0]||"—"],["Diversion 2",traff.diversion_roads?.[1]||"—"],
        ["ML confidence",`${(traff.ml_confidence*100).toFixed(0)}%`],["Confidence",`${(traff.confidence*100).toFixed(0)}%`]
      ])}
      ${ac("ti-shield","#d83232","Police Agent",[
        ["Protocol",pol.protocol],["Units dispatched",pol.units_dispatched],
        ["Perimeter",`${pol.perimeter_radius_m}m`],["Road blocked",pol.perimeter_road],
        ["Crowd risk",pol.crowd_risk],["Severity class",pol.severity_classified],
        ["ML severity",`${pol.ml_severity}/5`],["Confidence",`${(pol.confidence*100).toFixed(0)}%`]
      ])}
    </div>

    <div class="sec">Hospital Capacity — All Scored Options</div>
    <table class="htable">
      <thead><tr><th>Hospital</th><th>Free Beds</th><th>Distance</th><th>Trauma Unit</th><th>Score</th></tr></thead>
      <tbody>
        ${(hosp.all_hospitals||[]).sort((a,b)=>b.score-a.score).map(h=>`
          <tr class="${h.name===hosp.recommended?'selected':''}">
            <td>${h.name}${h.name===hosp.recommended?' ✓':''}</td>
            <td>${h.free_beds}</td>
            <td>${h.distance_km} km</td>
            <td><span class="badge-trauma ${h.trauma?'yes':''}">${h.trauma?"Yes":"No"}</span></td>
            <td>${(h.score||0).toFixed(3)}</td>
          </tr>`).join("")}
      </tbody>
    </table>

    <div class="sec" style="margin-top:24px">Coordination</div>
    <div class="agent-card" style="margin-bottom:12px">
      <div class="agent-head"><i class="ti ti-git-merge" style="color:#6f4bd8"></i> Multi-Agent Coordinator</div>
      <div class="agent-body">
        <strong>Status:</strong> ${coord.status}<br>
        <strong>Final ETA:</strong> ${coord.final_eta} min<br>
        <strong>Final route:</strong> ${coord.final_route||amb.route}<br>
        <strong>Conflicts detected:</strong> ${coord.conflicts_detected}<br>
        <strong>Ambulances:</strong> ${coord.resource_summary?.ambulances} · 
        <strong>Paramedics:</strong> ${coord.resource_summary?.paramedic_teams} · 
        <strong>Police:</strong> ${coord.resource_summary?.police_units} units · 
        <strong>Signals:</strong> ${coord.resource_summary?.signals_overridden} overridden
        ${coord.resolution?`<br><strong>Resolution:</strong> ${coord.resolution.action}`:""}
      </div>
    </div>

    <a href="/map" class="back-btn" style="margin-top:8px">
      <i class="ti ti-arrow-left"></i> Back to Live Map
    </a>
  `;
}

function ac(icon, color, title, rows) {
  return `<div class="agent-card">
    <div class="agent-head"><i class="ti ${icon}" style="color:${color}"></i> ${title}</div>
    <div class="agent-body">${rows.map(([k,v])=>`<div><strong>${k}:</strong> ${v}</div>`).join("")}</div>
  </div>`;
}
</script>
</body>
</html>
